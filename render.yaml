services:
  - type: web
    name: closr
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
      - key: CONSOLE_KEY
        sync: false
      - key: TOOLS_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DEMO_CUSTOMER_NAME
        value: Deveshu Pathak
